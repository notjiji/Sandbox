# Production Compose — internal data plane, single public HTTP entry (nginx).
#
# Place a TLS-terminating edge proxy (Caddy, Traefik, ALB, …) in front of nginx.
# Only nginx publishes a host port. Postgres, Redis, and workers stay on the internal network.
#
# Usage:
#   cp .env.production.example .env
#   # edit secrets and URLs
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d

name: sandbox-prod

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS}
  CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
  RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100/minute}
  RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/minute}
  FRONTEND_URL: ${FRONTEND_URL}
  PUBLIC_API_URL: ${PUBLIC_API_URL}
  SCAN_RUN_INLINE: "false"
  REPORT_RUN_INLINE: "false"
  REPORT_STORAGE_BACKEND: ${REPORT_STORAGE_BACKEND:-local}
  REPORT_STORAGE_PATH: /app/storage/reports

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  migrate:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    expose:
      - "8000"
    depends_on:
      <<: *backend-depends
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "${UVICORN_WORKERS:-4}"
    volumes:
      - report_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health/ready'); exit(0 if r.status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
      backend:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
    volumes:
      - report_storage:/app/storage
    networks:
      - internal

  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
      celery-worker:
        condition: service_started
    command: celery -A app.workers.celery_app beat --loglevel=info
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - internal

  backup:
    build:
      context: ./infrastructure/backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ROOT: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}
      BACKUP_REPORT_FILES: ${BACKUP_REPORT_FILES:-true}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      ENVIRONMENT: production
      REPORT_STORAGE_MOUNT: /report_storage
    volumes:
      - backup_storage:/backups
      - report_storage:/report_storage:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  report_storage:
  backup_storage:

networks:
  internal:
    driver: bridge

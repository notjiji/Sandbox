# Quality gate — runs on every push and pull request.
# PASS → merge allowed (configure branch protection to require this workflow).
# FAIL → block.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Pytest
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: sandbox_test
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: changeme-in-dev-only-32chars
          SECRET_KEY: test-secret-key-at-least-thirty-two-characters-long
          JWT_SECRET: test-jwt-secret-at-least-thirty-two-characters-long
          REDIS_URL: memory://
          RESEND_API_KEY: re_test_key_for_ci_runs_only_xx
          RESEND_FROM: ci@test.example.com
          ENVIRONMENT: development
          LOG_LEVEL: WARNING
        run: python -m pytest tests app -q --tb=short -m "not docker"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  production-docker-build:
    name: Production Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build production Compose images
        run: docker compose -f docker-compose.prod.yml build

      - name: Validate TLS edge (Caddy) configs
        run: bash scripts/ci/validate-edge.sh

  security:
    name: Security / secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository secret policy
        run: bash scripts/ci/check-secrets.sh

      - name: Test inventory drift check
        run: bash scripts/ci/check-test-inventory.sh

  backup-restore:
    name: Database restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Backup then restore into a throwaway database
        run: make backup-integration-test

  staging-acceptance:
    name: Staging end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Staging acceptance (workers, PDF after restart, audit)
        run: make staging-acceptance

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      [
        backend-tests,
        frontend-build,
        production-docker-build,
        security,
        backup-restore,
        staging-acceptance,
      ]
    if: always()
    steps:
      - name: Require all jobs to pass
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]] \
            || [[ "${{ needs.frontend-build.result }}" != "success" ]] \
            || [[ "${{ needs.production-docker-build.result }}" != "success" ]] \
            || [[ "${{ needs.security.result }}" != "success" ]] \
            || [[ "${{ needs.backup-restore.result }}" != "success" ]] \
            || [[ "${{ needs.staging-acceptance.result }}" != "success" ]]; then
            echo "Quality gate FAILED"
            exit 1
          fi
          echo "Quality gate PASSED"

# Staging acceptance — run before production promotion.
# Trigger manually from GitHub Actions → Staging acceptance.

name: Staging acceptance

on:
  workflow_dispatch:

concurrency:
  group: staging-acceptance
  cancel-in-progress: true

jobs:
  staging-acceptance:
    name: Full workflow acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install httpx pytest

      - name: Run staging acceptance
        run: bash scripts/staging/run-acceptance.sh

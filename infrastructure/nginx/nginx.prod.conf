worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format structured escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"request_id":"$http_x_request_id",'
            '"method":"$request_method",'
            '"endpoint":"$request_uri",'
            '"status_code":$status,'
            '"execution_time_ms":$request_time,'
            '"remote_addr":"$remote_addr",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log structured;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        # Internal endpoints — not exposed in production (OpenAPI also disabled in backend).
        location = /metrics {
            return 404;
        }

        location /docs {
            return 404;
        }

        location /redoc {
            return 404;
        }

        location = /openapi.json {
            return 404;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }
}
